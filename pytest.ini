[pytest]
pythonpath = .
testpaths = tests
addopts = --tracing retain-on-failure

# Test categories (select with: pytest -m smoke)
#   smoke    — read-only checks of public pages, safe anywhere
#   mutating — creates data (academies/students); gated by
#              EVALYTICS_AUTOMATION_ENABLED, disposable envs only
#   accounts — needs approved academy credentials (skips if unset)
#   unit     — pure data/factory tests, no browser
markers =
    smoke: read-only checks of public pages
    mutating: creates data; requires EVALYTICS_AUTOMATION_ENABLED=true
    accounts: requires approved academy credentials
    unit: pure data tests, no browser
