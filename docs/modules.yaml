# docs/modules.yaml
# Single source of truth for the Evalytics modules (M01-M18).
# The table in TEST-PLAN.md section 3.2 is a human-readable summary of this file.
#
# Fields
#   id        Module ID, referenced from stories via `covers: [M09, M10]`
#   name      Short module name
#   scope     in | skipped
#   priority  P0 (highest) .. P3, taken from the risk table in TEST-PLAN.md 5.1
#             unless marked "proposed" in a comment
#   epics     Epics that normally hold work for this module (in-scope only)
#   reason    Required when scope is skipped
#   skipped_on  Date the module was descoped (YYYY-MM-DD)
#
# Rule: a module is never deleted. If it is not being tested, mark it skipped
# and say why, so it shows up in the "untested areas" part of the final report.

