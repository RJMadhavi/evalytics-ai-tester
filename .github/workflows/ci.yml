name: CI

# ─────────────────────────────────────────────────────────────────────────────
# PR / push gate — runs on every change to the framework itself.
#
# Fast feedback, no secrets needed:
#   1. lint        — catches import errors and undefined names (pyflakes)
#   2. unit        — data-factory tests, no browser required
#   3. collect     — proves every test file imports cleanly
#   4. smoke       — read-only checks of the public website
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: VIRTUAL_ENV=$PWD/.venv uv pip install -r requirements.txt ruff
      - run: .venv/bin/ruff check --select F .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: VIRTUAL_ENV=$PWD/.venv uv pip install -r requirements.txt
      - run: .venv/bin/python -m pytest -m unit --no-tracing

  smoke:
    name: Smoke (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: VIRTUAL_ENV=$PWD/.venv uv pip install -r requirements.txt
      - run: .venv/bin/playwright install chromium --with-deps
      - name: Run smoke suite
        env:
          BASE_URL: ${{ vars.TARGET_URL || 'https://evalytics.in' }}
        run: .venv/bin/python -m pytest -m smoke
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: test-results/
