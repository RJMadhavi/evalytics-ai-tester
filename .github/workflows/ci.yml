name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown files
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  backlog-check:
    name: Backlog front matter check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backlog files
        run: python3 scripts/check_backlog.py

  unit-tests:
    name: Unit tests (automation guardrails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s automation/common/tests -t automation -v
